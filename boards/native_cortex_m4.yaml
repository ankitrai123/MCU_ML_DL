# Generic, vendor-neutral Cortex-M4 baseline -- a "modern 32-bit MCU" profile
# with no vendor HAL/peripheral assumptions. Useful as a portability reference
# point distinct from a real vendor chip like stm32f411: same architecture
# family and toolchain, different memory map and budget, expressed purely as
# YAML data.
id: native_cortex_m4
name: "Native Cortex-M4 (generic 32-bit baseline)"
architecture: arm-cortex-m4
bits: 32
endianness: little
clock_hz: 64000000

model_tier: deep

memory:
  flash_bytes: 262144      # 256 KB
  ram_bytes: 65536         # 64 KB
  flash_reserved_bytes: 8192
  ram_reserved_bytes: 4096

c_dialect:
  types:
    weight_i8: int8_t
    bias_i32: int32_t
    activation_i8: int8_t
    quant_accum: int32_t
    real: float
    classical_accum: float
    index: uint16_t
    class_index: uint8_t
  rom_qualifier: ""
  rom_guard_macro: null
  ram_qualifier: ""
  ram_guard_macro: null
  function_attributes: ""
  extra_includes: []

toolchain:
  compiler: arm-none-eabi-gcc
  compile_args:
    - "-mcpu=cortex-m4"
    - "-mthumb"
    - "-mfloat-abi=soft"
    - "-Os"
    - "-std=c99"
    - "-ffreestanding"
    - "-Wall"
  link_args:
    - "-nostdlib"
    - "-Wl,--gc-sections"
    - "-lgcc"   # soft-float runtime helpers (__aeabi_fadd etc.) -- not part of libc, safe under -nostdlib
  linker_script: "generic.ld.j2"
  linker_origins:
    flash: 0x00000000
    ram: 0x20000000
  objcopy: arm-none-eabi-objcopy
  output_format: ihex
  needs_startup_stub: true
  install_hint: "Debian/Ubuntu: apt-get install gcc-arm-none-eabi"

host_test:
  compiler: gcc
  compile_args: ["-std=c99", "-O2", "-Wall"]
  link_args: ["-lm"]
